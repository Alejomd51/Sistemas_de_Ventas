<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Inicio</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f3f4f6; margin: 0; }
        main { max-width: 680px; margin: 70px auto; padding: 28px; background: white; border-radius: 10px; }
        button { padding: 10px 16px; border: 0; border-radius: 6px; background: #dc2626; color: white; cursor: pointer; }
    </style>
</head>
<body>
<main>
    <h1>Bienvenido, {{ user.get_full_name|default:user.username }}</h1>
    <p>Has iniciado sesión como <strong>{{ user.get_rol_display }}</strong>.</p>

    {% if user.rol == 'ADMIN' %}
        <p><a href="{% url 'usuarios:panel_admin' %}">Ir al panel de administrador</a></p>
    {% elif user.rol == 'VENDEDOR' %}
        <p><a href="{% url 'usuarios:panel_vendedor' %}">Ir al panel de vendedor</a></p>
    {% endif %}

    <form method="post" action="{% url 'usuarios:logout' %}">
        {% csrf_token %}
        <button type="submit">Cerrar sesión</button>
    </form>
</main>
</body>
</html>
