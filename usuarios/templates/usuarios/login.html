<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesión</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f3f4f6; margin: 0; }
        main { max-width: 420px; margin: 70px auto; padding: 28px; background: white; border-radius: 10px; }
        label { display: block; margin-top: 14px; font-weight: bold; }
        input { box-sizing: border-box; width: 100%; padding: 9px; margin-top: 5px; }
        button { width: 100%; margin-top: 20px; padding: 11px; border: 0; border-radius: 6px; background: #2563eb; color: white; cursor: pointer; }
        .errorlist, .error { color: #b91c1c; }
        .mensaje { padding: 12px; background: #dcfce7; color: #166534; border-radius: 6px; }
        a { color: #2563eb; }
    </style>
</head>
<body>
<main>
    <h1>Iniciar sesión</h1>

    {% for message in messages %}
        <p class="mensaje">{{ message }}</p>
    {% endfor %}

    {% if form.errors %}
        <p class="error">El usuario o la contraseña no son correctos.</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
        <button type="submit">Ingresar</button>
    </form>

    <p><a href="{% url 'usuarios:password_reset' %}">¿Olvidaste tu contraseña?</a></p>
    <p>¿No tienes una cuenta? <a href="{% url 'usuarios:registro' %}">Regístrate</a></p>
</main>
</body>
</html>
