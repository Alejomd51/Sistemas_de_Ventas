<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Nueva contraseña</title></head>
<body>
<main>
    <h1>Establecer nueva contraseña</h1>
    {% if validlink %}
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Guardar contraseña</button>
        </form>
    {% else %}
        <p>El enlace ya fue utilizado o no es válido. Solicita uno nuevo.</p>
        <a href="{% url 'usuarios:password_reset' %}">Solicitar otro enlace</a>
    {% endif %}
</main>
</body>
</html>
