{% extends 'base.html' %}{% block title %}Nueva contraseña{% endblock %}{% block content %}<section class="cafe-card auth-card"><h1 class="cafe-title">Establecer nueva contraseña</h1>{% if validlink %}<form method="post" class="cafe-form">{% csrf_token %}{{ form.as_p }}<button class="btn-cafe" type="submit">Guardar contraseña</button></form>{% else %}<div class="cafe-alert error">El enlace ya fue utilizado o no es válido.</div><a href="{% url 'usuarios:password_reset' %}">Solicitar otro enlace</a>{% endif %}</section>{% endblock %}
