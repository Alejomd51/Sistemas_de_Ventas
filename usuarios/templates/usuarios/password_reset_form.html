<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Recuperar contraseña</title></head>
<body>
<main>
    <h1>Recuperar contraseña</h1>
    <p>Ingresa el correo asociado a tu cuenta.</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Enviar enlace</button>
    </form>
    <a href="{% url 'usuarios:login' %}">Volver al login</a>
</main>
</body>
</html>
